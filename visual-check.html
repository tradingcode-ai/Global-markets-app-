<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visual Check</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; height: 350px; position: relative; overflow: hidden; }
    h2 { font-size: 16px; margin-top: 0; color: #1e293b; }
  </style>
</head>
<body>
  <h1>Visual Comparison: META vs NVDA vs AAPL vs MSFT</h1>
  <div id="root"></div>
  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { StockLogoLoader } from '/src/components/StockLogoLoader.tsx';

    const tickers = ['META', 'NVDA', 'AAPL', 'MSFT'];

    function App() {
      return React.createElement('div', { className: 'grid' },
        tickers.map(ticker =>
          React.createElement('div', { key: ticker, className: 'card' },
            React.createElement('h2', null, ticker),
            React.createElement('div', {
              style: { position: 'relative', width: '100%', height: '280px' }
            },
              React.createElement(StockLogoLoader, {
                ticker: ticker,
                onComplete: () => console.log('Completed', ticker)
              })
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
