name: Global Markets News Agent Manual Runner

# Production scheduling is handled by the always-on Render service (server.js).
# Render runs the agent automatically at:
#   07:00 Europe/Amsterdam  -> MORNING_EUROPE
#   15:30 Europe/Amsterdam  -> US_OPEN
#   21:30 Europe/Amsterdam  -> MARKET_CLOSE
#
# This workflow intentionally has NO cron schedule, so GitHub Actions cannot
# create duplicate news editions. It remains available for manual tests/reruns.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Te draaien editie'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - MORNING_EUROPE
          - US_OPEN
          - MARKET_CLOSE

jobs:
  run-agent:
    name: Manual News Agent Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: global-markets-agent
        run: npm install

      - name: Run Global Markets News Agent
        working-directory: global-markets-agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_NEWS_MODEL: "gemini-3.8-flash"
          GEMINI_THINKING_LEVEL: "MEDIUM"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MARKET_NEWS_TIMEZONE: "Europe/Amsterdam"
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ "${{ github.event.inputs.edition }}" != "" ] && [ "${{ github.event.inputs.edition }}" != "AUTO" ]; then
            echo "Running specified edition: ${{ github.event.inputs.edition }}"
            node src/cli.js "${{ github.event.inputs.edition }}"
          else
            echo "Running with automatic time-based edition detection"
            node src/cli.js
          fi
