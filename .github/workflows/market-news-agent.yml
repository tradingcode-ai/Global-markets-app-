name: Global Markets News Agent Scheduled Runner

# Automatic schedule for Global Markets News Agent:
# Runs Monday through Friday across all 4 market editions (Amsterdam time):
#   02:30 Europe/Amsterdam (00:30 UTC CEST) -> ASIA_OPEN
#   07:00 Europe/Amsterdam (05:00 UTC CEST) -> MORNING_EUROPE
#   15:30 Europe/Amsterdam (13:30 UTC CEST) -> US_OPEN
#   21:30 Europe/Amsterdam (19:30 UTC CEST) -> MARKET_CLOSE

on:
  schedule:
    # ASIA_OPEN: 02:30 Amsterdam time (Ma-Vr)
    - cron: '30 0 * * 1-5'
    # MORNING_EUROPE: 07:00 Amsterdam time (Ma-Vr)
    - cron: '0 5 * * 1-5'
    # US_OPEN: 15:30 Amsterdam time (Ma-Vr)
    - cron: '30 13 * * 1-5'
    # MARKET_CLOSE: 21:30 Amsterdam time (Ma-Vr)
    - cron: '30 19 * * 1-5'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Te draaien editie'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - ASIA_OPEN
          - MORNING_EUROPE
          - US_OPEN
          - MARKET_CLOSE

jobs:
  run-agent:
    name: Run Market News Agent Edition
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -d "global-markets-agent" ]; then
            cd global-markets-agent
          fi
          npm install --no-audit

      - name: Run Global Markets News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_NEWS_MODEL: "gemini-3.8-flash"
          GEMINI_THINKING_LEVEL: "MEDIUM"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MARKET_NEWS_TIMEZONE: "Europe/Amsterdam"
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -d "global-markets-agent" ]; then
            cd global-markets-agent
          fi
          EDITION="${{ github.event.inputs.edition }}"
          if [ -z "$EDITION" ] || [ "$EDITION" = "AUTO" ]; then
            UTC_HOUR=$(date -u +%H)
            # Map UTC cron trigger hours to editions:
            # 13:30 UTC -> US_OPEN (15:30 Amsterdam)
            # 19:30 UTC -> MARKET_CLOSE (21:30 Amsterdam)
            # 00:30 UTC -> ASIA_OPEN (02:30 Amsterdam)
            # 05:00 UTC -> MORNING_EUROPE (07:00 Amsterdam)
            if [ "$UTC_HOUR" -ge 12 ] && [ "$UTC_HOUR" -lt 17 ]; then
              EDITION="US_OPEN"
            elif [ "$UTC_HOUR" -ge 17 ] && [ "$UTC_HOUR" -lt 23 ]; then
              EDITION="MARKET_CLOSE"
            elif [ "$UTC_HOUR" -ge 4 ] && [ "$UTC_HOUR" -lt 12 ]; then
              EDITION="MORNING_EUROPE"
            else
              EDITION="ASIA_OPEN"
            fi
            echo "Cron triggered at $(date -u +%H:%M) UTC -> Mapped to edition: $EDITION"
            node src/cli.js "$EDITION"
          else
            echo "Running specified edition: $EDITION"
            node src/cli.js "$EDITION"
          fi
