<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Single Ticker Test</title>
</head>
<body class="bg-slate-900/40 p-8 flex items-center justify-center min-h-screen">
  <div id="root"></div>
  <script type="module">
    import '/src/index.css';
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { StockLogoLoader } from '/src/components/StockLogoLoader.tsx';

    const params = new URLSearchParams(window.location.search);
    const ticker = params.get('ticker') || 'NVDA';

    function App() {
      return React.createElement('div', {
        className: 'bg-white shadow-2xl overflow-hidden flex flex-col border border-slate-200 rounded-2xl w-[700px] h-[500px] relative'
      },
        React.createElement(StockLogoLoader, {
          ticker: ticker,
          onComplete: () => console.log('COMPLETE_' + ticker)
        })
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
